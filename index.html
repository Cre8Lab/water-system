<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>水質與微生物檢驗查詢系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <!-- Vue 3 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* 隱藏滾動條但保持滾動功能 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* iOS 平滑滾動與觸控手感 */
    .smooth-scroll {
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans antialiased selection:bg-slate-300">
  <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col px-4 py-3 pb-8">
    
    <!-- 頂部資訊列：更新時間與模式切換按鈕 -->
    <header class="flex items-center justify-between gap-2 mb-3 bg-white px-3 py-2.5 rounded-xl shadow-sm border border-slate-200">
      <div class="flex items-center gap-1.5 flex-shrink-0 min-w-0">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs sm:text-sm font-medium text-slate-600 truncate">更新時間 {{ cloudUpdateTime }}</span>
      </div>
      
      <!-- 水質 / 微生物 切換按鈕 -->
      <div class="flex items-center gap-1.5 flex-shrink-0 whitespace-nowrap">
        <button 
          @click="switchMode('water')"
          :class="currentMode === 'water' ? 'bg-slate-700 text-white font-medium shadow-sm' : 'bg-white text-slate-600 border border-slate-300 hover:bg-slate-50'"
          class="px-3 py-1 rounded-lg text-xs sm:text-sm transition-all duration-150">
          水質
        </button>
        <button 
          @click="switchMode('microbio')"
          :class="currentMode === 'microbio' ? 'bg-slate-700 text-white font-medium shadow-sm' : 'bg-white text-slate-600 border border-slate-300 hover:bg-slate-50'"
          class="px-3 py-1 rounded-lg text-xs sm:text-sm transition-all duration-150">
          微生物
        </button>
      </div>
    </header>

    <!-- 篩選條件區域：業務員、客戶代號、取樣點 -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-3.5 mb-3.5 space-y-2.5">
      <!-- 業務員資訊 -->
      <div class="flex items-center text-sm">
        <span class="text-slate-500 w-20 flex-shrink-0 font-medium">業務員 :</span>
        <span class="text-slate-800 font-semibold truncate">{{ currentRepName }}</span>
        <span v-if="userRole === 'admin'" class="ml-2 text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-medium">管理者</span>
      </div>

      <!-- 客戶代號選單 -->
      <div class="flex items-center text-sm">
        <label for="customer-select" class="text-slate-500 w-20 flex-shrink-0 font-medium">客戶代號 :</label>
        <div class="relative flex-1">
          <select 
            id="customer-select"
            v-model="selectedCustomer" 
            @change="onCustomerChange"
            class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg px-2.5 py-1.5 focus:ring-2 focus:ring-slate-400 focus:outline-none appearance-none font-medium truncate pr-7">
            <option v-for="c in customerOptions" :key="c.code" :value="c.code">
              {{ c.name ? `${c.name} (${c.code})` : c.code }}
            </option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>
      </div>

      <!-- 取樣點選單 -->
      <div class="flex items-center text-sm">
        <label for="point-select" class="text-slate-500 w-20 flex-shrink-0 font-medium">取樣點 :</label>
        <div class="relative flex-1">
          <select 
            id="point-select"
            v-model="selectedPoint" 
            @change="onPointChange"
            class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg px-2.5 py-1.5 focus:ring-2 focus:ring-slate-400 focus:outline-none appearance-none font-medium truncate pr-7">
            <option v-for="pt in pointOptions" :key="pt" :value="pt">
              {{ pt }}
            </option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>
      </div>
    </section>

    <!-- 載入中狀態 -->
    <div v-if="isLoading" class="flex-1 flex flex-col items-center justify-center py-12">
      <div class="w-8 h-8 border-3 border-slate-300 border-t-slate-700 rounded-full animate-spin mb-3"></div>
      <p class="text-sm text-slate-500">載入雲端檢測紀錄中...</p>
    </div>

    <!-- 無數據狀態 -->
    <div v-else-if="filteredRecords.length === 0" class="flex-1 flex flex-col items-center justify-center py-12 bg-white rounded-2xl border border-slate-200">
      <svg class="w-12 h-12 text-slate-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
      <p class="text-sm text-slate-500">此取樣點暫無近五次歷史檢驗數據</p>
    </div>

    <!-- 數據卡片滑動區域 (橫向泡泡卡片，寬度 94%) -->
    <main v-else class="relative flex-1 flex flex-col">
      <!-- 左右滾動按鈕 (供桌面或觸控快速切換) -->
      <div class="flex items-center justify-between mb-1.5 px-1">
        <span class="text-xs text-slate-500 font-medium">近 5 次取樣歷史 (橫向滑動查看)</span>
        <div class="flex gap-1.5">
          <button 
            @click="scrollCarousel('left')" 
            class="w-6 h-6 rounded-full bg-white border border-slate-300 text-slate-700 flex items-center justify-center hover:bg-slate-100 shadow-xs"
            aria-label="前一筆">
            ‹
          </button>
          <button 
            @click="scrollCarousel('right')" 
            class="w-6 h-6 rounded-full bg-white border border-slate-300 text-slate-700 flex items-center justify-center hover:bg-slate-100 shadow-xs"
            aria-label="後一筆">
            ›
          </button>
        </div>
      </div>

      <!-- 卡片輪播滾動容器 -->
      <div 
        ref="carouselRef" 
        class="flex overflow-x-auto gap-4 snap-x snap-mandatory py-1 no-scrollbar smooth-scroll">
        
        <div 
          v-for="(record, idx) in filteredRecords" 
          :key="record.id || idx" 
          class="w-[94%] flex-shrink-0 snap-center bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 flex flex-col">
          
          <!-- 卡片日期標籤 -->
          <div class="flex items-center justify-between border-b border-slate-100 pb-2.5 mb-2.5">
            <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-semibold bg-slate-100 text-slate-700 tracking-wide">
              {{ record.sampleDate }}
            </span>
            <span class="text-[11px] text-slate-400">第 {{ idx + 1 }} / {{ filteredRecords.length }} 筆</span>
          </div>

          <!-- 分析數據明細列表 -->
          <!-- 顏色已對調：項目為深黑色 (text-slate-900)，數據為深灰色 (text-slate-600) -->
          <!-- 項目靠左、數據靠右，間距拉開不貼近 -->
          <div class="space-y-1.5">
            <div 
              v-for="item in record.displayItems" 
              :key="item.label" 
              class="flex justify-between items-center py-1 border-b border-slate-50 last:border-0 text-sm sm:text-base">
              
              <!-- 項目名稱：深黑色、靠左、清晰中黑 -->
              <span class="text-slate-900 font-medium text-left tracking-wide">
                {{ item.label }}
              </span>

              <!-- 檢測數據：深灰色、靠右、沉穩不壓迫 -->
              <span 
                v-if="item.isHtml" 
                v-html="item.value" 
                class="text-slate-600 font-semibold text-right tracking-wider">
              </span>
              <span 
                v-else 
                class="text-slate-600 font-semibold text-right tracking-wider">
                {{ item.value }}
              </span>
            </div>
          </div>
        </div>

      </div>
    </main>

    <!-- 底部版權與使用者標識 -->
    <footer class="mt-4 text-center text-[11px] text-slate-400">
      水質管理系統 &copy; 2026 &middot; User: {{ userIdDisplay }}
    </footer>

  </div>

  <script>
    const { createApp, ref, computed, onMounted, nextTick } = Vue;

    createApp({
      setup() {
        // 設定常數
        const LIFF_ID = '2012237984-DUU144BJ';
        const FIREBASE_PROJECT_ID = 'lab-system-6bb1b';

        // 響應式狀態
        const currentMode = ref('water'); // 'water' 或 'microbio'
        const cloudUpdateTime = ref('10/28 PM 02:36');
        const isLoading = ref(false);
        const carouselRef = ref(null);

        // 使用者資訊
        const lineUserId = ref('');
        const currentRepName = ref('湯生(Tom)');
        const userRole = ref('sales'); // 'admin' 或 'sales'
        const allowedCustomers = ref(['JVCM', 'JIEM']);

        // 選單資料
        const customerOptions = ref([
          { code: 'JVCM', name: '欣興電子' },
          { code: 'JIEM', name: '華通電腦' }
        ]);
        const selectedCustomer = ref('JVCM');

        const waterPointsMap = ref({
          'JVCM': ['PC5(37)-熱水/外管補水', 'PC5(37)-熱水/熱水槽', 'PC5(37)-冰水/外管補水', 'PC5(37)-冷卻水塔'],
          'JIEM': ['一廠-冷卻水塔A', '一廠-冰水主機', '二廠-鍋爐給水']
        });

        const microbioPointsMap = ref({
          'JVCM': ['PC5(37)-冷卻水塔', 'PC5(37)-冷卻水塔B'],
          'JIEM': ['一廠-冷卻水塔A', '二廠-冷卻水塔B']
        });

        const pointOptions = computed(() => {
          const map = currentMode.value === 'water' ? waterPointsMap.value : microbioPointsMap.value;
          return map[selectedCustomer.value] || [];
        });
        const selectedPoint = ref('PC5(37)-熱水/外管補水');

        // 水質模擬與緩存數據
        const waterRecords = ref([
          {
            id: 'w1',
            customer: 'JVCM',
            point: 'PC5(37)-熱水/外管補水',
            sampleDate: '2026/10/21',
            displayItems: [
              { label: 'pH', value: '8.2' },
              { label: 'Cond.', value: '165' },
              { label: 'P-A', value: '0' },
              { label: 'M-A', value: '12' },
              { label: 'T-H', value: '0' },
              { label: 'Ca-H', value: '0' },
              { label: 'Cl', value: '14.2' },
              { label: 'SO4', value: '18.5' },
              { label: 'SiO2', value: '8.1' },
              { label: 'TFe', value: '0.08' },
              { label: 'Zn', value: '0.02' }
            ]
          },
          {
            id: 'w2',
            customer: 'JVCM',
            point: 'PC5(37)-熱水/外管補水',
            sampleDate: '2026/10/14',
            displayItems: [
              { label: 'pH', value: '8.1' },
              { label: 'Cond.', value: '160' },
              { label: 'P-A', value: '0' },
              { label: 'M-A', value: '11' },
              { label: 'T-H', value: '0' },
              { label: 'Ca-H', value: '0' },
              { label: 'Cl', value: '13.8' },
              { label: 'SO4', value: '17.9' },
              { label: 'SiO2', value: '7.9' },
              { label: 'TFe', value: '0.07' },
              { label: 'Zn', value: '0.02' }
            ]
          },
          {
            id: 'w3',
            customer: 'JVCM',
            point: 'PC5(37)-熱水/外管補水',
            sampleDate: '2026/10/07',
            displayItems: [
              { label: 'pH', value: '8.3' },
              { label: 'Cond.', value: '172' },
              { label: 'P-A', value: '0' },
              { label: 'M-A', value: '14' },
              { label: 'T-H', value: '0' },
              { label: 'Ca-H', value: '0' },
              { label: 'Cl', value: '15.0' },
              { label: 'SO4', value: '19.2' },
              { label: 'SiO2', value: '8.4' },
              { label: 'TFe', value: '0.09' },
              { label: 'Zn', value: '0.02' }
            ]
          },
          {
            id: 'w4',
            customer: 'JVCM',
            point: 'PC5(37)-熱水/外管補水',
            sampleDate: '2026/09/30',
            displayItems: [
              { label: 'pH', value: '8.2' },
              { label: 'Cond.', value: '168' },
              { label: 'P-A', value: '0' },
              { label: 'M-A', value: '13' },
              { label: 'T-H', value: '0' },
              { label: 'Ca-H', value: '0' },
              { label: 'Cl', value: '14.5' },
              { label: 'SO4', value: '18.8' },
              { label: 'SiO2', value: '8.2' },
              { label: 'TFe', value: '0.08' },
              { label: 'Zn', value: '0.02' }
            ]
          },
          {
            id: 'w5',
            customer: 'JVCM',
            point: 'PC5(37)-熱水/外管補水',
            sampleDate: '2026/09/23',
            displayItems: [
              { label: 'pH', value: '8.0' },
              { label: 'Cond.', value: '159' },
              { label: 'P-A', value: '0' },
              { label: 'M-A', value: '10' },
              { label: 'T-H', value: '0' },
              { label: 'Ca-H', value: '0' },
              { label: 'Cl', value: '13.2' },
              { label: 'SO4', value: '17.4' },
              { label: 'SiO2', value: '7.8' },
              { label: 'TFe', value: '0.06' },
              { label: 'Zn', value: '0.01' }
            ]
          }
        ]);

        // 微生物模擬與緩存數據 (支援 10⁰ 上標顯示)
        const microbioRecords = ref([
          {
            id: 'm1',
            customer: 'JVCM',
            point: 'PC5(37)-冷卻水塔',
            sampleDate: '2026/10/21',
            displayItems: [
              { label: '總菌數 (CFU/mL)', value: '15 &times; 10<sup>0</sup>', isHtml: true },
              { label: '餘氯 (ppm)', value: '0.2' },
              { label: '總氯 (ppm)', value: '0.5' }
            ]
          },
          {
            id: 'm2',
            customer: 'JVCM',
            point: 'PC5(37)-冷卻水塔',
            sampleDate: '2026/10/14',
            displayItems: [
              { label: '總菌數 (CFU/mL)', value: '12 &times; 10<sup>0</sup>', isHtml: true },
              { label: '餘氯 (ppm)', value: '0.2' },
              { label: '總氯 (ppm)', value: '0.4' }
            ]
          },
          {
            id: 'm3',
            customer: 'JVCM',
            point: 'PC5(37)-冷卻水塔',
            sampleDate: '2026/10/07',
            displayItems: [
              { label: '總菌數 (CFU/mL)', value: '20 &times; 10<sup>0</sup>', isHtml: true },
              { label: '餘氯 (ppm)', value: '0.1' },
              { label: '總氯 (ppm)', value: '0.3' }
            ]
          }
        ]);

        // 依據當前選單過濾數據
        const filteredRecords = computed(() => {
          const list = currentMode.value === 'water' ? waterRecords.value : microbioRecords.value;
          return list.filter(r => r.customer === selectedCustomer.value && r.point === selectedPoint.value);
        });

        // 模式切換
        const switchMode = (mode) => {
          if (currentMode.value === mode) return;
          currentMode.value = mode;
          // 自動更新取樣點
          const options = pointOptions.value;
          if (options && options.length > 0) {
            selectedPoint.value = options[0];
          }
          fetchFirestoreData();
          nextTick(() => {
            if (carouselRef.value) carouselRef.value.scrollLeft = 0;
          });
        };

        const onCustomerChange = () => {
          const options = pointOptions.value;
          if (options && options.length > 0) {
            selectedPoint.value = options[0];
          }
          fetchFirestoreData();
          nextTick(() => {
            if (carouselRef.value) carouselRef.value.scrollLeft = 0;
          });
        };

        const onPointChange = () => {
          nextTick(() => {
            if (carouselRef.value) carouselRef.value.scrollLeft = 0;
          });
        };

        // 輪播滑動
        const scrollCarousel = (direction) => {
          if (!carouselRef.value) return;
          const container = carouselRef.value;
          const scrollAmount = container.clientWidth * 0.9;
          container.scrollBy({
            left: direction === 'left' ? -scrollAmount : scrollAmount,
            behavior: 'smooth'
          });
        };

        // 數值四捨五入輔助函式
        const formatValue = (val) => {
          if (val === null || val === undefined || val === '') return '-';
          if (typeof val === 'number') {
            return Number.isInteger(val) ? val.toString() : parseFloat(val.toFixed(4)).toString();
          }
          const num = Number(val);
          if (!isNaN(num) && val.trim() !== '') {
            return Number.isInteger(num) ? num.toString() : parseFloat(num.toFixed(4)).toString();
          }
          return val.toString();
        };

        // 從 Firestore REST 取得最新資料
        const fetchFirestoreData = async () => {
          try {
            const collection = currentMode.value === 'water' ? 'water_data' : 'microbio_data';
            const url = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/${collection}?pageSize=50`;
            
            const response = await fetch(url);
            if (!response.ok) return; // 若受限或無權限，保留預設資料
            
            const data = await response.json();
            if (!data.documents || data.documents.length === 0) return;

            const parsedList = data.documents.map(doc => {
              const fields = doc.fields || {};
              const getVal = (f) => {
                if (!f) return null;
                if (f.stringValue !== undefined) return f.stringValue;
                if (f.doubleValue !== undefined) return f.doubleValue;
                if (f.integerValue !== undefined) return parseInt(f.integerValue);
                if (f.timestampValue !== undefined) return f.timestampValue;
                return null;
              };

              const cust = getVal(fields.customer) || '';
              const pt = getVal(fields.point) || '';
              const rawDate = getVal(fields.sampleDate) || '';
              // 格式化日期為 YYYY/MM/DD
              let sampleDate = rawDate.replace(/-/g, '/').split('T')[0];

              // 解析各項目
              const displayItems = [];
              if (currentMode.value === 'water') {
                const standardKeys = ['pH', 'Cond.', 'P-A', 'M-A', 'T-H', 'Ca-H', 'Cl', 'SO4', 'SiO2', 'TFe', 'Zn', 'Cu', 'Al', 'Mn', 'SS', '濁度'];
                standardKeys.forEach(key => {
                  if (fields[key]) {
                    const raw = getVal(fields[key]);
                    if (raw !== null && raw !== '') {
                      displayItems.push({ label: key, value: formatValue(raw) });
                    }
                  }
                });
              } else {
                if (fields.totalBacteria) {
                  let bVal = getVal(fields.totalBacteria);
                  let formatted = formatValue(bVal);
                  if (formatted.includes('10^') || formatted.includes('100') || formatted.includes('10⁰')) {
                    formatted = formatted.replace(/10\^?0/g, '10<sup>0</sup>');
                    displayItems.push({ label: '總菌數 (CFU/mL)', value: formatted, isHtml: true });
                  } else {
                    displayItems.push({ label: '總菌數 (CFU/mL)', value: formatted });
                  }
                }
                if (fields.freeChlorine) displayItems.push({ label: '餘氯 (ppm)', value: formatValue(getVal(fields.freeChlorine)) });
                if (fields.totalChlorine) displayItems.push({ label: '總氯 (ppm)', value: formatValue(getVal(fields.totalChlorine)) });
              }

              return {
                id: doc.name,
                customer: cust,
                point: pt,
                sampleDate: sampleDate,
                displayItems: displayItems
              };
            });

            // 依日期降冪排序
            parsedList.sort((a, b) => (b.sampleDate || '').localeCompare(a.sampleDate || ''));

            if (currentMode.value === 'water') {
              waterRecords.value = parsedList;
            } else {
              microbioRecords.value = parsedList;
            }

          } catch (err) {
            console.warn('載入 Firestore 資料異常，維持本地資料:', err);
          }
        };

        // 載入元數據 (更新時間與白名單權限)
        const loadMetadata = async () => {
          try {
            const metaUrl = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/metadata/water_catalog`;
            const res = await fetch(metaUrl);
            if (res.ok) {
              const metaDoc = await res.json();
              if (metaDoc.fields && metaDoc.fields.lastUpdate) {
                cloudUpdateTime.value = metaDoc.fields.lastUpdate.stringValue || cloudUpdateTime.value;
              }
            }
          } catch (e) {
            console.log('使用預設更新時間');
          }
        };

        // 初始化 LIFF
        const initLiff = async () => {
          try {
            if (typeof liff === 'undefined') return;
            await liff.init({ liffId: LIFF_ID });
            if (liff.isLoggedIn()) {
              const profile = await liff.getProfile();
              lineUserId.value = profile.userId;
              // 查詢白名單
              try {
                const userDocUrl = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/users_whitelist/${profile.userId}`;
                const uRes = await fetch(userDocUrl);
                if (uRes.ok) {
                  const uDoc = await uRes.json();
                  if (uDoc.fields) {
                    if (uDoc.fields.name) currentRepName.value = uDoc.fields.name.stringValue;
                    if (uDoc.fields.role) userRole.value = uDoc.fields.role.stringValue;
                  }
                }
              } catch (e) {
                console.log('白名單讀取跳過');
              }
            }
          } catch (err) {
            console.log('LIFF 初始化完成或瀏覽器預覽模式');
          }
        };

        const userIdDisplay = computed(() => {
          return lineUserId.value ? lineUserId.value.substring(0, 8) + '...' : 'Browser/Guest';
        });

        onMounted(async () => {
          await loadMetadata();
          await initLiff();
          await fetchFirestoreData();
        });

        return {
          currentMode,
          cloudUpdateTime,
          isLoading,
          carouselRef,
          currentRepName,
          userRole,
          customerOptions,
          selectedCustomer,
          pointOptions,
          selectedPoint,
          filteredRecords,
          userIdDisplay,
          switchMode,
          onCustomerChange,
          onPointChange,
          scrollCarousel
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
